resume_generation_task:
  description: >
    Generate candidate resume for:
    Title: {title}
    Vacancy: {text}
    LinkedIn: {linkedin_url}

    Extract personal_info, summary, education, experience, skills, projects, and certifications from candidate profile.
    Keep text concise (2-sentence summary, 1-2 highlights per experience/project).
    Do not access external URLs. Set linkedin_url literally in personal_info if provided.
  expected_output: >
    A ResumeCrewAI object.
  agent: resume_agent