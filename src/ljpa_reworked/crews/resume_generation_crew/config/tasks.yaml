resume_generation_task:
  description: >
    Generate candidate resume for:
    Title: {title}
    Vacancy: {text}
    LinkedIn: {linkedin_url}

    Candidate profile:
    {candidate_profile}

    Evaluation Plan:
    Summary: {summary}
    Rating: {rating}
    Required sections: {required_profile_sections}
    Prioritized facts: {prioritized_facts}
    Missing facts: {missing_mandatory_facts}

    RETRY FEEDBACK (obey when non-empty): {retry_feedback}
    Retry feedback is produced after deterministic RenderCV validation. If RETRY FEEDBACK is provided, apply the requested wording or bullet adjustments using only candidate profile facts.
    PREVIOUS RESUME JSON (repair it when non-empty, return full replacement JSON): {prior_resume_json}

    Extract and cover every applicable verified profile section in strict order: Summary, Skills, Experience, Education, Certifications, Projects directly from the candidate profile supplied above.

    STATIC FACTS POLICY:
    The application restores identity, employer, job title, location, dates, and education from the candidate profile after this task. Do not invent, omit, rename, or alter those static facts. Generate only tailored wording for summary, skill categories/elements, experience bullet descriptions aligned to profile experience order, project descriptions/highlights, and certifications.

    STRICT FACTUALITY RULE:
    Use only verified candidate profile facts. Do NOT invent tools, roles, metrics, credentials, dates, duties, or outcomes not found in the candidate profile; omit unsupported tools, responsibilities, metrics, dates, credentials, and outcomes. You may adapt wording and order to emphasize vacancy-relevant experience, but every claim must remain strictly grounded in profile facts.

    FIELD-BY-FIELD OUTPUT CONTRACT:
    1. personal_info: Copy name, email, phone, address, location, and linkedin_url. Set target_title to a short ATS-friendly title for this vacancy.
    2. summary: Write one dense professional summary using relevant keywords grounded only in verified candidate profile facts.
    3. skills: JSON schema is mandatory: each item is exactly `{"title": "category name", "elements": ["skill 1", "skill 2"]}`. Create several named categories with concrete profile skills in elements.
    4. experience: HARD SCHEMA GATE. Every experience object MUST include `title`, `company`, `location`, `start_date`, `end_date`, and `description` (a JSON array). Copy static fields from profile. Write at least 3 description bullets per role detailing action, technical scope, and outcome grounded in profile facts.
    5. education: Include every supplied education entry once.
    6. projects: Every project object MUST include `title`, `description`, and `highlights` (a JSON array of exactly 3 or 4 non-empty strings). Use candidate-profile facts only.
    7. certifications: Every certification must be an object: `{"title": "Certification Title"}`. Add issuer, date, and url only when explicitly present in candidate profile.

    IMPORTANT: Output ONLY raw valid JSON matching the ResumeCrewAI schema. Do NOT wrap in ```json ``` code blocks. Do NOT include any intro text or reasoning content.
  expected_output: >
    Raw JSON object matching the ResumeCrewAI schema starting with '{' and ending with '}'.
  agent: resume_agent