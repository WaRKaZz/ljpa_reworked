generate_job_search_queries_task:
  description: |
    Analyze the candidate profile below and produce a focused JobSpy search plan.

    Candidate profile:
    ---
    {profile_text}
    ---

    Use the candidate's Job Search Preferences for locations, not their current or past residence. Use location `worldwide` in at least one query when preferences say worldwide; do not replace it with a country list. When preferences say worldwide, use location  in at least one query; do not replace it with a country list. Generate 10 to 15 distinct, realistic queries. Prefer specific role-and-skill queries over generic terms. Cover different roles, skills, locations, and supported job boards. Allowed site_name values only: linkedin, indeed, glassdoor, google, zip_recruiter. Do not create near-duplicate queries.

    Return only data that validates against JobSearchQuerySet. Set profile_sha256 exactly to {profile_sha256}. Each query must use one supported site_name and contain a non-empty search_term and location. Do not include explanations, markdown, salary claims, credentials not present in the profile, application instructions, URLs, or lifecycle/status fields.
  expected_output: "A JobSearchQuerySet JSON object only."
  agent: query_strategist
