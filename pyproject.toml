[project]
name = "ljpa_reworked"
version = "0.1.0"
description = "LinkedIn job-application pipeline with an isolated Antigravity Harness for vacancy discovery and URL submission."
authors = [{ name = "WaRKaZz", email = "danilov@duck.com" }]
requires-python = ">=3.12,<3.15"
dependencies = [
    "crewai[tools]>=1.15,<2",
    "google-antigravity>=0.1.10",
    "playwright>=1.55.0",
    "protobuf>=5.29.0",
    "python-jobspy>=1.1.80",
    "rendercv[full]>=2.8,<2.9",
    "rendercv-fonts>=0.5.1",
    "sqlalchemy>=2.0.41",
    "thefuzz[speedup]>=0.22.1",
    "typst>=0.15.0",
    "fastapi>=0.141.1",
    "gdown>=5.2.0",
    "uvicorn>=0.52.1",
]

[tool.uv]
override-dependencies = [
    "regex>=2026.1.15",
    "protobuf>=5.29.0",
]





[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ljpa_reworked"]

[tool.hatch.envs.dev.scripts]
test = "pytest"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "D",   # pydocstyle for better documentation
    "ASYNC",  # Async checks (future-proof for CrewAI)
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "D417",  # Missing argument descriptions (optional for now)
    "ASYNC210", "ASYNC220",  # Ignore async warnings
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", "D200", "D205", "D401", "D404"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pyright]
exclude = ["src/ljpa_reworked/crews"]
reportArgumentType = "none"
reportReturnType = "none"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=ljpa_reworked --cov-report=term-missing"

[tool.coverage.run]
source = ["src/ljpa_reworked"]
omit = [
    "**/__init__.py",
    "src/ljpa_reworked/main.py",
]

[tool.coverage.report]
fail_under = 65
