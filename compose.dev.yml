services:
  cloak-browser:
    image: cloakhq/cloakbrowser:latest
    container_name: cloak-browser-dev
    security_opt:
      - seccomp:unconfined
    ports:
      - "9222:9222"
    volumes:
      - ./resources:/app/resources
    command: cloakserve --host 0.0.0.0 --port 9222
    networks:
      - ljpa-network

  antigravity-cli-dev:
    build:
      context: .
      dockerfile: Dockerfile.antigravity
    container_name: antigravity-cli-dev
    depends_on:
      cloak-browser:
        condition: service_started
    volumes:
      - ./resources:/app/resources
      - ./data:/app/data
      - ./prompts:/app/prompts
      - ./src/ljpa_reworked/services/harness/linkedin_posts_agent.py:/app/linkedin_posts_agent.py:ro
      - ./src/ljpa_reworked/services/harness/jobspy_etl_fetcher.py:/app/jobspy_etl_fetcher.py:ro
      - ./.agents:/app/.agents
      - ./.gemini:/root/.gemini
    env_file:
      - .env
    environment:
      - CDP_URL=${CDP_URL:-http://cloak-browser:9222}
    stdin_open: true
    tty: true
    command: tail -f /dev/null
    networks:
      - ljpa-network

networks:
  ljpa-network:
    driver: bridge
