services:
  cloak-browser:
    image: cloakhq/cloakbrowser:latest
    container_name: cloak-browser-dev
    security_opt:
      - seccomp:unconfined
    environment:
      - PORT=6080
      - CDP_PORT=9222
    ports:
      - "9222:9222"
      - "6080:6080"
      - "5900:5900"
    volumes:
      - ./auth:/app/auth
    networks:
      - ljpa-network

networks:
  ljpa-network:
    driver: bridge
