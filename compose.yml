services:
  cloak-browser:
    image: cloakhq/cloakbrowser:latest
    container_name: cloak-browser
    security_opt:
      - seccomp:unconfined
    ports:
      - "9222:9222"
    volumes:
      - ./resources:/app/resources
    networks:
      - ljpa-network

  linkedin-bot:
    build: .
    container_name: linkedin-bot
    depends_on:
      cloak-browser:
        condition: service_started
    volumes:
      - ./resources:/app/resources
      - ./data:/app/data
      - ./src:/app/src
    env_file:
      - .env
    environment:
      - CDP_URL=${CDP_URL:-http://cloak-browser:9222}
    command: uv run src/ljpa_reworked/main.py
    networks:
      - ljpa-network

networks:
  ljpa-network:
    driver: bridge
