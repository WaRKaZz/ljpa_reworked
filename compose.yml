services:
  cloak-browser:
    image: docker.io/cloakhq/cloakbrowser:latest
    container_name: cloak-browser
    security_opt:
      - seccomp:unconfined
    env_file: [ .env ]
    volumes:
      - ./data:/app/data
      - ./src/ljpa_reworked/services/docker/init_cloak.sh:/init_cloak.sh:ro
    entrypoint: [ "/bin/sh", "/init_cloak.sh" ]
    networks: [ ljpa-network ]

  # linkedin-bot:
  #   build: .
  #   container_name: linkedin-bot
  #   depends_on:
  #     cloak-browser:
  #       condition: service_started
  #     antigravity-cli:
  #       condition: service_started
  #   volumes:
  #     - ./data:/app/data
  #     - ./resources:/app/resources:ro
  #   env_file: [.env]
  #   environment:
  #     CDP_URL: ${CDP_URL:-http://cloak-browser:9222}
  #   command: uv run python -m ljpa_reworked.main
  #   networks: [ljpa-network]

  antigravity-cli:
    build:
      context: .
      dockerfile: Dockerfile.antigravity
    container_name: antigravity-cli
    userns_mode: keep-id
    ports: [ "8080:8080" ]
    depends_on:
      cloak-browser:
        condition: service_started
    volumes:
      - ./runtime:/runtime
      - ./resources:/inputs/resources:ro
    env_file: [ .env ]
    environment:
      CDP_URL: ${CDP_URL:-http://cloak-browser:9222}
      HARNESS_DATA_DIR: /runtime/harness-scraper
      HARNESS_RESOURCES_DIR: /inputs/resources
      GEMINI_DIR: /runtime/gemini
    stdin_open: true
    tty: true
    command: [ "python3", "/app/harness/harness_server.py" ]
    networks: [ ljpa-network ]

  sqlite-ui:
    build:
      context: .
      dockerfile: Dockerfile.sqlite
    container_name: sqlite-ui
    ports: [ "7901:7901" ]
    volumes: [ "./data:/data" ]
    networks: [ ljpa-network ]

networks:
  ljpa-network:
    driver: bridge
