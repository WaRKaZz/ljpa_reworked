services:
  cloak-browser:
    image: cloakhq/cloakbrowser:latest
    container_name: cloak-browser
    security_opt:
      - seccomp:unconfined
    ports:
      - "9222:9222"
    volumes:
      - ./resources:/app/resources
    command: cloakserve --host 0.0.0.0 --port 9222
    networks:
      - ljpa-network

  linkedin-bot:
    build: .
    container_name: linkedin-bot
    depends_on:
      cloak-browser:
        condition: service_started
    volumes:
      - ./resources:/app/resources
      - ./data:/app/data
      - ./src:/app/src
      - ./tests:/app/tests
      - ./compose.yml:/app/compose.yml
    env_file:
      - .env
    environment:
      - CDP_URL=${CDP_URL:-http://cloak-browser:9222}
    command: uv run src/ljpa_reworked/main.py
    networks:
      - ljpa-network

  antigravity-cli:
    build: .
    container_name: antigravity-cli
    depends_on:
      cloak-browser:
        condition: service_started
    volumes:
      - ./resources:/app/resources
      - ./data:/app/data
      - ./src:/app/src
      - ./tests:/app/tests
      - ./compose.yml:/app/compose.yml
      - ./.agents:/app/.agents
      - ./.gemini:/root/.gemini
      - /home/warkazz/.local/bin/agy:/usr/local/bin/agy:ro
    env_file:
      - .env
    environment:
      - CDP_URL=${CDP_URL:-http://cloak-browser:9222}
    stdin_open: true
    tty: true
    command: tail -f /dev/null
    networks:
      - ljpa-network

networks:
  ljpa-network:
    driver: bridge
