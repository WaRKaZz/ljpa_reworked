services:
  cloak-browser:
    image: docker.io/cloakhq/cloakbrowser:latest
    container_name: cloak-browser
    security_opt:
      - seccomp:unconfined
    env_file: [ .env ]
    volumes:
      - ./data:/app/data
      - ./src/ljpa_reworked/services/docker/init_cloak.sh:/init_cloak.sh:ro
    command: [ "/bin/sh", "/init_cloak.sh" ]
    networks: [ ljpa-network ]

  linkedin-bot:
    image: localhost/ljpa_reworked_linkedin-bot:latest
    build: .
    container_name: linkedin-bot
    userns_mode: keep-id
    depends_on:
      cloak-browser:
        condition: service_started
      antigravity-cli:
        condition: service_started
    volumes:
      - ./data:/app/data
      - ./resources:/app/resources
      - ./runtime/harness-scraper:/app/runtime/harness-scraper
    env_file: [ .env ]
    environment:
      CDP_URL: ${CDP_URL:-http://cloak-browser:9222}
      UV_CACHE_DIR: /tmp/.uv-cache
    command: [ "sh", "-c", "mkdir -p /app/data && touch /app/data/bot.log && tail -F /app/data/bot.log" ]
    networks: [ ljpa-network ]


  antigravity-cli:
    build:
      context: .
      dockerfile: Dockerfile.antigravity
    container_name: antigravity-cli
    userns_mode: keep-id
    ports: [ "8080:8080" ]
    depends_on:
      cloak-browser:
        condition: service_started
    volumes:
      - ./runtime:/runtime
      - ./resources:/inputs/resources:ro
    env_file: [ .env ]
    environment:
      CDP_URL: ${CDP_URL:-http://cloak-browser:9222}
      HARNESS_DATA_DIR: /runtime/harness-scraper
      HARNESS_RESOURCES_DIR: /inputs/resources
      GEMINI_DIR: /runtime/gemini
      BROWSER_USE_MODEL: ${BROWSER_USE_MODEL:-free-tier}
    stdin_open: true
    tty: true
    command: [ "python3", "/app/harness/harness_server.py" ]
    networks: [ ljpa-network ]

  datasette:
    image: docker.io/datasetteproject/datasette:latest
    container_name: datasette
    ports: [ "7901:7901" ]
    volumes:
      - ./data:/data
      - ./static:/app/static:ro
      - ./metadata.json:/app/metadata.json:ro
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - >
        pip install -q --no-cache-dir datasette-search-all datasette-jellyfish datasette-render-markdown &&
        exec datasette /data/app.db -h 0.0.0.0 -p 7901 --metadata /app/metadata.json --static static:/app/static --setting sql_time_limit_ms 5000 --setting truncate_cells_html 120 --setting default_page_size 50
    networks: [ ljpa-network ]

networks:
  ljpa-network:
    driver: bridge
