services:
  cloak-browser:
    image: docker.io/cloakhq/cloakbrowser:latest
    container_name: cloak-browser
    security_opt:
      - seccomp:unconfined
    env_file: [ .env ]
    volumes:
      - ./data:/app/data
      - ./src/ljpa_reworked/services/docker/init_cloak.sh:/init_cloak.sh:ro
    command: [ "/bin/sh", "/init_cloak.sh" ]
    networks: [ ljpa-network ]

  linkedin-bot:
    image: localhost/ljpa_reworked_linkedin-bot:latest
    build: .
    container_name: linkedin-bot
    userns_mode: keep-id
    depends_on:
      cloak-browser:
        condition: service_started
      antigravity-cli:
        condition: service_started
      sqlite-ui:
        condition: service_started
    volumes:
      - ./data:/app/data
      - ./resources:/app/resources
    env_file: [ .env ]
    environment:
      CDP_URL: ${CDP_URL:-http://cloak-browser:9222}
      UV_CACHE_DIR: /tmp/.uv-cache
    command: uv run --no-dev python -m ljpa_reworked.main --mode full
    networks: [ ljpa-network ]

  linkedin-bot-full:
    image: localhost/ljpa_reworked_linkedin-bot:latest
    container_name: linkedin-bot-full
    userns_mode: keep-id
    depends_on:
      cloak-browser:
        condition: service_started
      antigravity-cli:
        condition: service_started
      sqlite-ui:
        condition: service_started
    volumes:
      - ./data:/app/data
      - ./resources:/app/resources
    env_file: [ .env ]
    environment:
      CDP_URL: ${CDP_URL:-http://cloak-browser:9222}
      UV_CACHE_DIR: /tmp/.uv-cache
    command: uv run --no-dev python -m ljpa_reworked.main --mode full
    networks: [ ljpa-network ]

  linkedin-bot-collect:
    image: localhost/ljpa_reworked_linkedin-bot:latest
    container_name: linkedin-bot-collect
    userns_mode: keep-id
    depends_on:
      cloak-browser:
        condition: service_started
      antigravity-cli:
        condition: service_started
      sqlite-ui:
        condition: service_started
    volumes:
      - ./data:/app/data
      - ./resources:/app/resources
    env_file: [ .env ]
    environment:
      CDP_URL: ${CDP_URL:-http://cloak-browser:9222}
      UV_CACHE_DIR: /tmp/.uv-cache
    command: uv run --no-dev python -m ljpa_reworked.main --mode collect
    networks: [ ljpa-network ]

  linkedin-bot-process:
    image: localhost/ljpa_reworked_linkedin-bot:latest
    container_name: linkedin-bot-process
    userns_mode: keep-id
    depends_on:
      cloak-browser:
        condition: service_started
      antigravity-cli:
        condition: service_started
      sqlite-ui:
        condition: service_started
    volumes:
      - ./data:/app/data
      - ./resources:/app/resources
    env_file: [ .env ]
    environment:
      CDP_URL: ${CDP_URL:-http://cloak-browser:9222}
      UV_CACHE_DIR: /tmp/.uv-cache
    command: uv run --no-dev python -m ljpa_reworked.main --mode process
    networks: [ ljpa-network ]

  antigravity-cli:
    build:
      context: .
      dockerfile: Dockerfile.antigravity
    container_name: antigravity-cli
    userns_mode: keep-id
    ports: [ "8080:8080" ]
    depends_on:
      cloak-browser:
        condition: service_started
    volumes:
      - ./runtime:/runtime
      - ./resources:/inputs/resources:ro
    env_file: [ .env ]
    environment:
      CDP_URL: ${CDP_URL:-http://cloak-browser:9222}
      HARNESS_DATA_DIR: /runtime/harness-scraper
      HARNESS_RESOURCES_DIR: /inputs/resources
      GEMINI_DIR: /runtime/gemini
    stdin_open: true
    tty: true
    command: [ "python3", "/app/harness/harness_server.py" ]
    networks: [ ljpa-network ]

  sqlite-ui:
    build:
      context: .
      dockerfile: Dockerfile.sqlite
    container_name: sqlite-ui
    ports: [ "7901:7901" ]
    volumes: [ "./data:/data" ]
    networks: [ ljpa-network ]

networks:
  ljpa-network:
    driver: bridge
